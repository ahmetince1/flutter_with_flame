<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Arka plan - gradient -->
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#98FB98;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#bg)" />

    <!-- Bulutlar -->
    <circle cx="80" cy="60" r="20" fill="white" opacity="0.8" />
    <circle cx="100" cy="60" r="25" fill="white" opacity="0.8" />
    <circle cx="120" cy="60" r="20" fill="white" opacity="0.8" />

    <circle cx="250" cy="40" r="15" fill="white" opacity="0.6" />
    <circle cx="265" cy="40" r="20" fill="white" opacity="0.6" />
    <circle cx="280" cy="40" r="15" fill="white" opacity="0.6" />

    <!-- Güneş -->
    <circle cx="350" cy="50" r="30" fill="#FFD700" />

    <!-- Dağlar -->
    <polygon points="0,200 100,120 200,200" fill="#8B4513" opacity="0.7" />
    <polygon points="150,200 250,100 350,200" fill="#A0522D" opacity="0.7" />
</svg>
